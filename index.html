<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>ARBIN SAJID</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f7f8fc;color:#111827}
.wrap{max-width:760px;margin:auto;padding:48px 18px}
.logo{text-align:center;font-size:30px;font-weight:800;margin:20px 0 8px}.sub{text-align:center;color:#6b7280;margin-bottom:28px}
.search{display:flex;gap:8px;background:white;border:1px solid #d9dce5;border-radius:18px;padding:7px;box-shadow:0 6px 24px #0000000b}
input{flex:1;border:0;outline:0;font-size:17px;padding:12px;background:transparent}
button{border:0;border-radius:13px;padding:11px 16px;background:#111827;color:white;font-size:15px;cursor:pointer}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 28px}
.quick button{background:white;color:#374151;border:1px solid #e5e7eb}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 4px 18px #00000008}
h2{font-size:19px;margin:0 0 12px}.title{font-size:18px;font-weight:700}.muted{color:#6b7280}.source{font-size:13px;color:#2563eb;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{background:#f3f4f6;color:#111827}
.loading{text-align:center;padding:25px;color:#6b7280}.error{color:#b91c1c}
footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🔎 ARBIN SAJID</div>
  <div class="sub">সহজে খুঁজুন • তথ্য দেখুন • উৎস যাচাই করুন</div>

  <form class="search" id="form">
    <input id="q" placeholder="যা খুঁজতে চান লিখুন..." autocomplete="off">
    <button>Search</button>
  </form>

  <div class="quick">
    <button onclick="quick('বাংলাদেশ')">🇧🇩 বাংলাদেশ</button>
    <button onclick="quick('আজকের খবর')">📰 খবর</button>
    <button onclick="quick('কৃত্রিম বুদ্ধিমত্তা')">🤖 AI</button>
  </div>

  <div id="results"></div>
  <footer>ARBIN SAJID — প্রথম সংস্করণ</footer>
</div>

<script>
const q=document.getElementById('q'), results=document.getElementById('results');
function quick(x){q.value=x; search(x)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();search(q.value.trim())});

async function search(term){
  if(!term){q.focus();return}
  results.innerHTML='<div class="loading">🔎 খুঁজছি...</div>';

  const t=term.trim().toLowerCase();
  const quickAnswers = [
    {keys:["বাংলাদেশের রাজধানী","রাজধানী কী","capital of bangladesh"],
     title:"বাংলাদেশের রাজধানী",
     answer:"বাংলাদেশের রাজধানী হলো ঢাকা।",
     source:"বাংলাদেশ — Wikipedia",
     url:"https://bn.wikipedia.org/wiki/ঢাকা"},
    {keys:["বাংলাদেশের জাতীয় ফুল","বাংলাদেশের জাতীয় ফুল","জাতীয় ফুল"],
     title:"বাংলাদেশের জাতীয় ফুল",
     answer:"বাংলাদেশের জাতীয় ফুল হলো শাপলা।",
     source:"বাংলাদেশ — Wikipedia",
     url:"https://bn.wikipedia.org/wiki/বাংলাদেশ"},
    {keys:["বাংলাদেশের জাতীয় ফল","বাংলাদেশের জাতীয় ফল","জাতীয় ফল"],
     title:"বাংলাদেশের জাতীয় ফল",
     answer:"বাংলাদেশের জাতীয় ফল হলো কাঁঠাল।",
     source:"বাংলাদেশ — Wikipedia",
     url:"https://bn.wikipedia.org/wiki/বাংলাদেশ"}
  ];
  const found=quickAnswers.find(x=>x.keys.some(k=>t.includes(k)));

  let html='';
  if(found){
    html+=`<div class="card"><h2>🤖 সরাসরি উত্তর</h2>
      <div style="font-size:19px;line-height:1.7">${esc(found.answer)}</div>
      <div class="source">উৎস: ${esc(found.source)}</div>
      <div class="actions"><button onclick="window.open('${found.url}','_blank')">উৎস খুলুন</button></div>
    </div>`;
  }

  try{
    const url='https://bn.wikipedia.org/w/api.php?action=query&list=search&srsearch='+
      encodeURIComponent(term)+'&srlimit=6&utf8=1&format=json&origin=*';
    const r=await fetch(url);
    const data=await r.json();
    const items=data.query?.search||[];

    html+=`<div class="card"><h2>🌐 সার্চ ফলাফল</h2>`;
    if(!items.length){
      html+='<div class="muted">এই বিষয়ে Wikipedia-তে ফলাফল পাওয়া যায়নি।</div>';
    } else {
      items.forEach(x=>{
        const title=x.title||'';
        const snippet=(x.snippet||'').replace(/<[^>]*>/g,'');
        const url='https://bn.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'));
        html+=`<div style="padding:14px 0;border-bottom:1px solid #eee">
          <div class="title">${esc(title)}</div>
          <div style="margin-top:6px;line-height:1.6">${esc(snippet)}</div>
          <div class="source">bn.wikipedia.org</div>
          <div class="actions"><button onclick="window.open('${url}','_blank')">ফলাফল খুলুন</button></div>
        </div>`;
      });
    }
    html+='</div>';

    html+=`<div class="card"><h2>🔎 Google Web Search</h2>
      <div class="muted">আরও ওয়েব ফলাফল দেখতে Google-এ একই সার্চ খুলুন।</div>
      <div class="actions"><button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(term)}','_blank')">Google Search খুলুন</button></div>
    </div>`;

    results.innerHTML=html;
  }catch(e){
    results.innerHTML=(html||'')+'<div class="card error">ইন্টারনেট সংযোগ বা তথ্য-সার্ভিসে সমস্যা হয়েছে। আবার চেষ্টা করুন।</div>';
  }
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body>
</html>
